<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Korean Listening Practice</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 1000px;
            margin: 32px auto;
            padding: 0 16px;
            background: #f7f7f8;
            color: #222;
        }

        h1 { margin-bottom: 8px; }

        .layout {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 24px;
            margin-top: 24px;
        }

        .panel {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 16px;
            min-width: 0;
        }

        #clip-list {
            max-height: 65vh;
            overflow-y: auto;
        }

        button, input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .clip-button, .utterance {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px;
            margin: 4px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
        }

        .clip-button.active, .utterance.active {
            background: #e8f0ff;
            border-color: #7299e8;
        }

        .utterance {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 12px;
            align-items: start;
        }

        .timestamp {
            color: #666;
            font-size: 0.9rem;
        }

        .utterance-text {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        audio {
            width: 100%;
            margin: 12px 0;
        }

        #clip-search,
        #utterance-search {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            margin: 12px 0;
        }

        #status {
            color: #666;
            font-size: 0.9rem;
        }

        .settings {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 16px;
            margin: 12px 0;
        }

        .setting {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .speed-setting {
            display: grid;
            grid-template-columns: auto minmax(100px, 1fr) 55px;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
        }

        #speed {
            width: 100%;
            cursor: pointer;
        }

        #speed-value {
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        #caption {
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            min-height: 90px;
            margin: 12px 0 20px;
            padding: 16px;
            background: #eef2f8;
            border-radius: 8px;
            font-size: 1.15rem;
            line-height: 1.7;
            text-align: center;
            overflow-wrap: anywhere;
        }

        #caption.disabled {
            color: #888;
            font-size: 0.9rem;
        }

        @media (max-width: 650px) {
            .layout {
                grid-template-columns: 1fr;
            }

            #clip-list {
                max-height: 220px;
            }

            .utterance {
                grid-template-columns: 80px 1fr;
            }

            .speed-setting {
                grid-template-columns: auto minmax(80px, 1fr) 48px;
                gap: 8px;
            }
        }
    </style>
</head>

<body>
    <h1>Korean Listening Practice</h1>
    <p id="status">Loading recordings…</p>

    <div class="layout">
        <aside class="panel">
            <h2>Recordings</h2>

            <input
                id="clip-search"
                type="search"
                placeholder="Filter recordings…"
            >

            <div id="clip-list"></div>
        </aside>

        <main class="panel">
            <h2 id="clip-title">Choose a recording</h2>

            <audio id="player" controls preload="metadata"></audio>

            <div class="speed-setting">
                <label for="speed">Speed</label>
                <input
                    id="speed"
                    type="range"
                    min="0.5"
                    max="1.5"
                    step="0.05"
                    value="1"
                >
                <output id="speed-value" for="speed">1.00×</output>
            </div>

            <div class="settings">
                <label class="setting">
                    <input id="captions-enabled" type="checkbox">
                    Show captions
                </label>
            </div>

            <div id="caption" class="disabled">
                Captions are off
            </div>

            <label class="setting">
                <input
                    id="hide-short"
                    type="checkbox"
                    checked
                >
                Hide utterances with 3 characters or fewer
            </label>

            <label for="utterance-search">Filter utterances:</label>

            <input
                id="utterance-search"
                type="search"
                placeholder="Search Korean text…"
            >

            <p id="utterance-count"></p>
            <div id="utterance-list"></div>
        </main>
    </div>

    <script>
        const clipList = document.querySelector("#clip-list");
        const clipSearch = document.querySelector("#clip-search");
        const utteranceSearch = document.querySelector("#utterance-search");
        const utteranceList = document.querySelector("#utterance-list");
        const utteranceCount = document.querySelector("#utterance-count");
        const player = document.querySelector("#player");
        const status = document.querySelector("#status");
        const clipTitle = document.querySelector("#clip-title");
        const speed = document.querySelector("#speed");
        const speedValue = document.querySelector("#speed-value");
        const captionsEnabled = document.querySelector("#captions-enabled");
        const caption = document.querySelector("#caption");
        const hideShort = document.querySelector("#hide-short");

        let clips = [];
        let currentClip = null;
        let utterances = [];
        let activeUtteranceEnd = null;
        let activeUtterance = null;
        let selectionId = 0;

        const utteranceCache = new Map();
        const utteranceButtons = new Map();

        function parseEntry(entry) {
            // Supports [start, end, text] and object-shaped entries.
            if (Array.isArray(entry)) {
                return {
                    start: Number(entry[0]),
                    end: Number(entry[1]),
                    text: String(entry[2] ?? "").trim()
                };
            }

            return {
                start: Number(entry.start),
                end: Number(entry.end),
                text: String(entry.text ?? "").trim()
            };
        }

        function formatTime(seconds) {
            if (!Number.isFinite(seconds)) return "--:--";

            const minutes = Math.floor(seconds / 60);
            const remaining = (seconds % 60)
                .toFixed(1)
                .padStart(4, "0");

            return `${minutes}:${remaining}`;
        }

        async function getJson(url) {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    `${response.status} ${response.statusText}`
                );
            }

            return response.json();
        }

        function renderClips() {
            const query = clipSearch.value.trim().toLowerCase();
            clipList.replaceChildren();

            clips
                .filter(name => name.toLowerCase().includes(query))
                .forEach(name => {
                    const button = document.createElement("button");
                    button.className = "clip-button";
                    button.textContent = name;

                    if (name === currentClip) {
                        button.classList.add("active");
                    }

                    button.addEventListener("click", () => selectClip(name));
                    clipList.append(button);
                });
        }

        async function selectClip(name) {
            const thisSelection = ++selectionId;

            currentClip = name;
            utterances = [];
            activeUtterance = null;
            activeUtteranceEnd = null;
            utteranceButtons.clear();

            player.pause();
            player.removeAttribute("src");
            player.load();

            caption.textContent = "";
            caption.classList.toggle("disabled", !captionsEnabled.checked);

            if (!captionsEnabled.checked) {
                caption.textContent = "Captions are off";
            }

            renderClips();

            clipTitle.textContent = name;
            utteranceList.replaceChildren();
            utteranceCount.textContent = "";
            utteranceSearch.value = "";
            status.textContent = `Loading ${name}…`;

            try {
                if (!utteranceCache.has(name)) {
                    const data = await getJson(
                        `/api/clips/${encodeURIComponent(name)}/utterances`
                    );

                    // The API may return entries directly or inside tiers.
                    const entries = Array.isArray(data)
                        ? data
                        : data.tiers[3].entries;

                    // Keep ALL utterances in the cache, including short ones.
                    utteranceCache.set(name, entries.map(parseEntry));
                }

                if (thisSelection !== selectionId) return;

                utterances = utteranceCache.get(name);
                renderUtterances();

                player.src =
                    `/api/clips/${encodeURIComponent(name)}/play`;
                player.playbackRate = Number(speed.value);
                player.load();

                status.textContent =
                    `${utterances.length} utterances loaded`;
            } catch (error) {
                if (thisSelection !== selectionId) return;

                status.textContent =
                    `Could not load recording: ${error.message}`;
            }
        }

        function getVisibleUtterances() {
            const query = utteranceSearch.value.trim().toLowerCase();

            return utterances.filter(item => {
                const matchesSearch = item.text.toLowerCase().includes(query);

                // Count Korean characters without counting spaces or other
                // whitespace. Captions still use the full utterance array.
                const characterCount = item.text.replace(/\s/g, "").length;
                const isShort = characterCount <= 3;

                return matchesSearch && !(hideShort.checked && isShort);
            });
        }

        function renderUtterances() {
            const filtered = getVisibleUtterances();

            utteranceList.replaceChildren();
            utteranceButtons.clear();

            utteranceCount.textContent =
                `${filtered.length} shown / ${utterances.length} total utterances`;

            filtered.forEach(item => {
                const button = document.createElement("button");
                button.className = "utterance";

                const time = document.createElement("span");
                time.className = "timestamp";
                time.textContent =
                    `${formatTime(item.start)} – ${formatTime(item.end)}`;

                const text = document.createElement("span");
                text.className = "utterance-text";
                text.textContent = item.text;

                button.append(time, text);
                utteranceButtons.set(item, button);

                if (activeUtterance === item) {
                    button.classList.add("active");
                }

                button.addEventListener("click", () => playUtterance(item));
                utteranceList.append(button);
            });
        }

        async function playUtterance(item) {
            const thisSelection = selectionId;

            activeUtterance = item;
            activeUtteranceEnd = item.end;

            utteranceButtons.forEach(button => {
                button.classList.remove("active");
            });

            const button = utteranceButtons.get(item);
            if (button) button.classList.add("active");

            updateCaption(item);

            const seekAndPlay = async () => {
                if (thisSelection !== selectionId) return;

                player.currentTime = item.start;

                try {
                    await player.play();
                } catch (error) {
                    activeUtteranceEnd = null;
                    status.textContent =
                        `Playback failed: ${error.message}`;
                }
            };

            if (player.readyState >= 1) {
                await seekAndPlay();
            } else {
                player.addEventListener("loadedmetadata", seekAndPlay, {
                    once: true
                });
                player.load();
            }
        }

        function updateCaption(item) {
            if (!captionsEnabled.checked) {
                caption.textContent = "Captions are off";
                caption.classList.add("disabled");
                return;
            }

            caption.classList.remove("disabled");
            caption.textContent = item ? item.text : "";
        }

        function updateActiveUtterance(time) {
            const current = utterances.find(item =>
                time >= item.start && time < item.end
            );

            if (current !== activeUtterance) {
                activeUtterance = current ?? null;

                utteranceButtons.forEach(button => {
                    button.classList.remove("active");
                });

                const button = current
                    ? utteranceButtons.get(current)
                    : null;

                if (button) button.classList.add("active");

                updateCaption(current ?? null);
            }
        }

        speed.addEventListener("input", () => {
            const rate = Number(speed.value);
            player.playbackRate = rate;
            speedValue.textContent = `${rate.toFixed(2)}×`;
        });

        captionsEnabled.addEventListener("change", () => {
            updateCaption(activeUtterance);
        });

        hideShort.addEventListener("change", renderUtterances);

        clipSearch.addEventListener("input", renderClips);
        utteranceSearch.addEventListener("input", renderUtterances);

        player.addEventListener("timeupdate", () => {
            const time = player.currentTime;

            if (
                activeUtteranceEnd !== null &&
                time >= activeUtteranceEnd
            ) {
                const end = activeUtteranceEnd;

                activeUtteranceEnd = null;
                player.pause();
                player.currentTime = end;

                updateCaption(activeUtterance);
                return;
            }

            updateActiveUtterance(time);
        });

        player.addEventListener("ended", () => {
            activeUtteranceEnd = null;
        });

        init();

        async function init() {
            try {
                clips = await getJson("/api/clips");
                renderClips();

                status.textContent = `${clips.length} recordings loaded`;
            } catch (error) {
                status.textContent =
                    `Could not load recordings: ${error.message}`;
            }
        }
    </script>
</body>
</html>
